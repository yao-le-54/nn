site_name: 智能飞行控制系统
site_description: 基于 AirSim 无人机仿真平台的智能飞行控制与碰撞检测系统
site_author: 你的名字
repo_url: https://github.com/yao-le-54/nn
repo_name: GitHub

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换亮色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换暗色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.integrate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yao-le-54/nn

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 功能实现: features/index.md
  - 相机拍照功能: features/camera.md
  - 键盘控制: features/keyboard.md
  - 航点规划: features/waypoints.md
  - API 参考: api.md
  - 机器学习: ml/index.md
  - 碰撞数据采集: ml/data-collection.md
  - 碰撞预测模型: ml/model.md
  - 运行步骤: quickstart.md
  - 配置说明: config.md
